<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>liebao-bid-bot</title>
    <script>
      // Runs before paint so an explicit saved choice doesn't flash the
      // other theme first; index.css handles the OS-preference case itself
      // via `prefers-color-scheme`, so this only needs to act when the
      // viewer has overridden that (see ThemeToggle.tsx).
      (function () {
        var saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.dataset.theme = saved;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
