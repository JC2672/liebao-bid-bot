[project]
name = "liebao-bid-bot-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-jobspy>=1.1.80",
    "python-multipart>=0.0.12",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "openpyxl>=3.1",
    "gspread>=6.1",
    "google-auth>=2.35",
    "jinja2>=3.1",
    "playwright>=1.48",
    "pyperclip>=1.9",
]

[tool.setuptools]
# Only `app/` is real package code; `profiles/` is user data that happens to
# live alongside it, and setuptools' flat-layout auto-discovery otherwise
# errors out trying to treat both as top-level packages.
packages = ["app"]
